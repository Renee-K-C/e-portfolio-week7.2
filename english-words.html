<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff4d6">
  <title>Let's Learn English!</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #3b3151;
      --pink: #ff7ca8;
      --pink-dark: #e7598b;
      --mint: #8ee2c0;
      --yellow: #ffd86e;
      --blue: #a9dcff;
      --paper: #fffaf0;
      --green: #16845d;
      --red: #d94355;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      background: #fff4d6;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
    }
    body::before, body::after {
      position: fixed;
      z-index: -1;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      content: "";
      opacity: .65;
    }
    body::before { top: -90px; left: -70px; background: var(--mint); }
    body::after { right: -85px; bottom: -90px; background: #ffc2d6; }
    button { font: inherit; }
    [hidden] { display: none !important; }
    .app {
      width: min(100%, 760px);
      min-height: 540px;
      padding: clamp(22px, 5vw, 48px);
      border: 5px solid #fff;
      border-radius: 34px;
      background: var(--paper);
      box-shadow: 0 16px 0 rgba(76, 59, 101, .08), 0 24px 60px rgba(76, 59, 101, .12);
    }
    .screen { min-height: 440px; text-align: center; }
    .home-screen, .victory-screen {
      min-height: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .mascot { margin: 0 0 12px; font-size: clamp(68px, 15vw, 112px); line-height: 1; }
    h1 { margin: 8px 0 12px; font-size: clamp(36px, 8vw, 64px); line-height: 1.05; }
    .home-screen h1 { color: var(--pink-dark); }
    .subtitle { margin: 0 0 30px; color: #716780; font-size: clamp(18px, 4vw, 23px); }
    .primary-button {
      min-height: 68px;
      padding: 14px 40px;
      border: 0;
      border-radius: 22px;
      color: #473251;
      background: var(--yellow);
      box-shadow: 0 7px 0 #eab83d;
      font-size: 27px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .primary-button:hover { transform: translateY(-2px); box-shadow: 0 9px 0 #eab83d; }
    .primary-button:active { transform: translateY(5px); box-shadow: 0 2px 0 #eab83d; }
    button:focus-visible { outline: 4px solid #6751a2; outline-offset: 4px; }
    .quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .question-count { padding: 9px 15px; border-radius: 999px; background: #e8f8f0; font-size: 17px; font-weight: 800; }
    .progress { height: 14px; margin-bottom: 25px; overflow: hidden; border-radius: 999px; background: #eee7f3; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--mint), #61cba5); transition: width .25s ease; }
    .prompt { margin: 0 0 16px; font-size: clamp(22px, 5vw, 30px); }
    .picture-frame {
      width: min(100%, 320px);
      height: 220px;
      margin: 0 auto 24px;
      padding: 12px;
      display: grid;
      place-items: center;
      border: 3px solid #fff;
      border-radius: 25px;
      background: #e9f8f1;
      box-shadow: 0 6px 0 #d9eee3;
    }
    .picture-frame img { width: 100%; height: 100%; object-fit: contain; border-radius: 16px; }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; max-width: 540px; margin: 0 auto; }
    .answer {
      min-height: 66px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 3px solid #e8e0f0;
      border-radius: 19px;
      color: var(--ink);
      background: #fff;
      font-size: clamp(20px, 4vw, 25px);
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .answer:hover:not(:disabled) { transform: translateY(-2px); border-color: #b6a4d2; background: #fcf8ff; }
    .answer:disabled { cursor: default; }
    .answer.wrong { color: #a72e41; border-color: #ee8a93; background: #fff0f1; }
    .answer.correct { color: #116744; border-color: #65c79d; background: #e9fff4; }
    .mark { min-width: 28px; font-size: 28px; font-weight: 900; }
    .feedback { min-height: 34px; margin: 16px 0 0; font-size: 20px; font-weight: 900; }
    .feedback.try-again { color: var(--red); }
    .feedback.well-done { color: var(--green); }
    .victory-screen h1 { color: #e7598b; }
    .victory-stars { margin: 2px 0 14px; font-size: 44px; }
    .victory-copy { margin: 0 0 28px; font-size: 23px; }
    .victory-screen .primary-button { background: var(--mint); box-shadow: 0 7px 0 #5fbd98; }
    .victory-screen .primary-button:active { box-shadow: 0 2px 0 #5fbd98; }
    @media (max-width: 520px) {
      body { padding: 12px; }
      .app { min-height: 0; padding: 22px 18px; border-radius: 26px; }
      .screen, .home-screen, .victory-screen { min-height: 470px; }
      .picture-frame { height: 190px; }
      .answers { gap: 9px; }
      .answer { min-height: 60px; padding: 10px 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app" aria-live="polite">
    <section class="screen home-screen" id="home-screen">
      <div class="mascot" aria-hidden="true">🐻</div>
      <h1>Let's learn English</h1>
      <p class="subtitle">Ready to play and learn new words?</p>
      <button class="primary-button" id="start-button" type="button">Start!</button>
    </section>

    <section class="screen quiz-screen" id="quiz-screen" hidden>
      <div class="quiz-top">
        <span class="question-count" id="question-count">Question 1 of 3</span>
        <span aria-hidden="true">⭐</span>
      </div>
      <div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="prompt">What do you see?</p>
      <div class="picture-frame">
        <img id="question-image" src="1.jpg" alt="An apple" draggable="false">
      </div>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" aria-live="assertive"></p>
    </section>

    <section class="screen victory-screen" id="victory-screen" hidden>
      <div class="mascot" aria-hidden="true">🦊</div>
      <div class="victory-stars" aria-hidden="true">🌟 🎉 🌟</div>
      <h1>You did it!</h1>
      <p class="victory-copy">You learned all 3 words. Great job!</p>
      <button class="primary-button" id="play-again" type="button">Play again</button>
    </section>
  </main>

  <script>
    const questions = [
      { image: '1.jpg', alt: 'A red apple', answer: 'apple', choices: ['apple', 'banana', 'pear', 'grape'] },
      { image: '2.jpg', alt: 'A friendly dog', answer: 'dog', choices: ['cat', 'dog', 'mouse', 'bird'] },
      { image: '3.jpg', alt: 'An eye', answer: 'eye', choices: ['hand', 'foot', 'eye', 'nose'] }
    ];
    const homeScreen = document.getElementById('home-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const victoryScreen = document.getElementById('victory-screen');
    const image = document.getElementById('question-image');
    const answers = document.getElementById('answers');
    const feedback = document.getElementById('feedback');
    const count = document.getElementById('question-count');
    const progress = document.getElementById('progress-fill');
    const progressBar = document.querySelector('[role="progressbar"]');
    let questionIndex = 0;
    let locked = false;

    function showScreen(active) {
      homeScreen.hidden = active !== homeScreen;
      quizScreen.hidden = active !== quizScreen;
      victoryScreen.hidden = active !== victoryScreen;
    }

    function renderQuestion() {
      locked = false;
      const question = questions[questionIndex];
      count.textContent = `Question ${questionIndex + 1} of ${questions.length}`;
      progress.style.width = `${(questionIndex / questions.length) * 100}%`;
      progressBar.setAttribute('aria-valuenow', String(questionIndex));
      image.src = question.image;
      image.alt = question.alt;
      feedback.textContent = '';
      feedback.className = 'feedback';
      answers.replaceChildren();
      question.choices.forEach((choice) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'answer';
        button.setAttribute('aria-label', choice);
        const word = document.createElement('span');
        word.textContent = choice;
        const mark = document.createElement('span');
        mark.className = 'mark';
        mark.setAttribute('aria-hidden', 'true');
        button.append(word, mark);
        button.addEventListener('click', () => chooseAnswer(button, choice));
        answers.append(button);
      });
    }

    function chooseAnswer(button, choice) {
      if (locked) return;
      const question = questions[questionIndex];
      const mark = button.querySelector('.mark');
      if (choice !== question.answer) {
        button.classList.add('wrong');
        mark.textContent = '✗';
        button.disabled = true;
        feedback.textContent = 'Try another one!';
        feedback.className = 'feedback try-again';
        return;
      }
      locked = true;
      button.classList.add('correct');
      mark.textContent = '✓';
      answers.querySelectorAll('button').forEach((option) => { option.disabled = true; });
      feedback.textContent = 'Well done!';
      feedback.className = 'feedback well-done';
      progress.style.width = `${((questionIndex + 1) / questions.length) * 100}%`;
      progressBar.setAttribute('aria-valuenow', String(questionIndex + 1));
      window.setTimeout(() => {
        questionIndex += 1;
        if (questionIndex === questions.length) {
          showScreen(victoryScreen);
          return;
        }
        renderQuestion();
      }, 700);
    }

    document.getElementById('start-button').addEventListener('click', () => {
      questionIndex = 0;
      renderQuestion();
      showScreen(quizScreen);
    });
    document.getElementById('play-again').addEventListener('click', () => {
      questionIndex = 0;
      showScreen(homeScreen);
    });
  </script>
</body>
</html>
